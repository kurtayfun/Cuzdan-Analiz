<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#27272a" stroke-width="4"/>
  
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 8" opacity="0.25"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10b981" stroke-width="2" opacity="0.15"/>

  <!-- Core Icon: Turkish Lira Emblem & Shield/Growth Bars -->
  <g transform="translate(136, 126)">
    <!-- Upward Trend Chart Line behind -->
    <path d="M 10 180 L 70 140 L 140 160 L 230 70" fill="none" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <circle cx="230" cy="70" r="10" fill="#60a5fa" filter="url(#glow)"/>

    <!-- Lira Symbol (₺) -->
    <path d="M 90 20 L 90 220 C 170 220 180 140 180 140" fill="none" stroke="url(#emeraldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Double Bars on Lira -->
    <line x1="50" y1="90" x2="160" y2="60" stroke="url(#emeraldGrad)" stroke-width="20" stroke-linecap="round"/>
    <line x1="50" y1="135" x2="160" y2="105" stroke="url(#emeraldGrad)" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
